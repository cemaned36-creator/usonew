name: Optimization report checks

on:
  pull_request:
    paths:
      - "backend/app/services/optimization.py"
      - "backend/app/services/optimization_report.py"
      - "backend/app/services/optimization_history.py"
      - "backend/tests/test_optimization_report.py"
      - "frontend/app/optimization/page.tsx"
      - "frontend/app/layout.tsx"
      - "frontend/components/OptimizationReport.tsx"
      - "frontend/components/OptimizationHistory.tsx"
      - ".github/workflows/optimization-report-check.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - run: python -m pytest tests/test_optimization_report.py -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
